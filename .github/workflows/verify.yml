name: Verify SATLINK
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: satlink
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: satlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm run lint
        working-directory: frontend
      - run: python -m pip install -r requirements-dev.txt -c requirements-dev.lock.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          SATLINK_TEST_DATABASE_URL: postgresql+psycopg://satlink:test-only@127.0.0.1:5432/satlink_test
